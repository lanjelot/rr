name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  # Run by export-and-push.sh after it pushes new data: the orphan `data` branch
  # has no workflow file, so a push there can't trigger this itself.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # pinned to main since pushes to `data` also trigger this workflow
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          ref: data
          path: frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_STATIC_DATA: "true"
        run: npm run build

      # GitHub Pages has no SPA fallback: direct navigation/refresh on a client
      # route (e.g. /events/123) 404s unless 404.html serves the same app shell.
      - name: SPA fallback for client-side routing
        run: cp frontend/build/client/index.html frontend/build/client/404.html

      # A page per event with its title and flyer as Open Graph tags, so shared
      # event links get a preview (crawlers don't run the app).
      - name: Event pages with link previews
        working-directory: frontend
        run: node scripts/event-pages.mjs build/client

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
